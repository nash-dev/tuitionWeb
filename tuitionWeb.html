
<!DOCTYPE html> 
<html> 
<head>Content-Type: text/html; charset=utf-8</head>
<body> 

<video id="myVideo" width="320" height="240" controls>
  <source src="movie.mp4" type="video/mp4">
  <source src="movie.ogg" type="video/ogg">
  Your browser does not support the video tag.
</video><br>

<button onclick="getPlaySpeed()" type="button">What is the default playback speed?</button>
<button onclick="setPlaySpeed()" type="button">Set video to be play in slow motion</button>
<button onclick="increase()" type="button">Increase Speed+</button>
<button onclick="decrease()" type="button">Decrease Speed-</button>

<script>
// Correctly reference the video element
var x = document.getElementById("myVideo");

function getPlaySpeed() { 
  alert(x.playbackRate); // Changed to playbackRate to show current speed
} 

function setPlaySpeed() { 
  x.playbackRate = 0.5; // Changed to 0.5 for actual slow motion
} 

function increase() {
  x.playbackRate += 0.5; // Increments smoothly by 0.5
}

function decrease() {
  if (x.playbackRate > 0.5) {
    x.playbackRate -= 0.5; // Decrements smoothly down to 0.5 minimum
  }
}
</script> 

</body> 
</html>
